<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PLEXIS Quant Studio — Pine Script dans le navigateur</title>
    <meta
      name="description"
      content="Écrivez du Pine Script v5/v6, cliquez sur Run et regardez-le se tracer sur un graphique en direct. 100 % côté client."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d10'/%3E%3Cpath d='M7 22 13 11l5 7 3-4 4 8' fill='none' stroke='%2342bda8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="hero">
        <div class="hero-left">
          <p class="eyebrow">PINE SCRIPT · RUNS IN YOUR BROWSER</p>
          <h1>PLEXIS Quant Studio</h1>
        </div>
        <p class="hero-sub">
          Écrivez du Pine Script<sup>®</sup>, cliquez sur Run et regardez-le se tracer sur un
          graphique en direct. Aucune inscription, rien à installer.
        </p>
      </header>

      <main id="split" class="split">
        <!-- VOLET GAUCHE (60 %) : graphique Vela -->
        <section class="pane pane-chart" aria-label="Graphique">
          <div id="chart" class="chart"></div>
        </section>

        <div id="gutter" class="gutter" role="separator" aria-orientation="vertical" tabindex="0" title="Glisser pour redimensionner (double-clic : réinitialiser)"></div>

        <!-- VOLET DROIT (40 %) : éditeur Monaco -->
        <section class="pane pane-editor" aria-label="Éditeur Pine Script">
          <div class="toolbar">
            <div class="select-wrap">
              <select id="template-select" aria-label="Exemples de scripts"></select>
              <svg class="select-caret" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path d="m3.5 6 4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="toolbar-actions">
              <button id="btn-reset" class="btn btn-ghost" type="button" title="Remettre le script d'origine">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M2.5 8a5.5 5.5 0 1 0 1.8-4.07M2.5 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="btn-label">Reset</span>
              </button>
              <button id="btn-share" class="btn btn-outline" type="button" title="Copier un lien contenant le script">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M6.5 9.5 9.5 6.5M7 4.5l.9-.9a3 3 0 0 1 4.25 4.25l-.9.9M9 11.5l-.9.9A3 3 0 0 1 3.85 8.15l.9-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="btn-label">Share</span>
              </button>
              <button id="btn-run" class="btn btn-run" type="button" title="⌘/Ctrl+Enter">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="M4.5 3v10l8-5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                </svg>
                Run
              </button>
            </div>
          </div>

          <div id="editor" class="editor"></div>
          <div id="status" class="status" role="status" aria-live="polite">
            <span class="status-dim">Chargement du moteur…</span>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
