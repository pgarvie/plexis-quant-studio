<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PLEXIS Quant Studio — Pine Script in your browser</title>
    <meta
      name="description"
      content="Write Pine Script v5/v6, press Run and watch it plot on a live chart. Runs 100% in your browser."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d10'/%3E%3Cpath d='M7 22 13 11l5 7 3-4 4 8' fill='none' stroke='%2342bda8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="hero">
        <div class="hero-left">
          <p class="eyebrow">PINE SCRIPT · RUNS IN YOUR BROWSER</p>
          <h1>PLEXIS Quant Studio</h1>
        </div>
        <p class="hero-sub">
          Write Pine Script<sup>®</sup>, press Run and watch it plot on a live chart. No sign-up,
          nothing to install.
        </p>
      </header>

      <main id="split" class="split">
        <!-- LEFT PANE (60%): data bar + Vela chart -->
        <section class="pane pane-chart" aria-label="Chart">
          <div class="databar">
            <label class="field">
              <span class="field-label">Source</span>
              <span class="select-wrap select-sm">
                <select id="source-select" aria-label="Data source"></select>
                <svg class="select-caret" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="m3.5 6 4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </label>
            <label class="field">
              <span class="field-label">Symbol</span>
              <input id="symbol-input" class="input" type="text" list="symbol-suggestions" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Symbol" />
            </label>
            <button id="btn-load" class="btn btn-outline btn-sm" type="button" title="Load this symbol (Enter)">Load</button>
            <label id="key-field" class="field" hidden>
              <span class="field-label">API key</span>
              <input id="key-input" class="input input-key" type="password" autocomplete="off" spellcheck="false" placeholder="Twelve Data API key" aria-label="Twelve Data API key" />
            </label>
            <a id="key-link" class="key-link" href="https://twelvedata.com" target="_blank" rel="noopener noreferrer" hidden>Get a key</a>
            <span id="data-msg" class="data-msg" role="status" aria-live="polite"></span>
          </div>
          <datalist id="symbol-suggestions"></datalist>
          <div id="chart" class="chart"></div>
        </section>

        <div id="gutter" class="gutter" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize (double-click to reset)"></div>

        <!-- RIGHT PANE (40%): Monaco editor -->
        <section class="pane pane-editor" aria-label="Pine Script editor">
          <div class="filebar">
            <div class="filebar-actions">
              <button id="btn-open" class="btn btn-ghost btn-sm" type="button" title="Open a .pine file (Ctrl/⌘+O)">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M1.75 4.25a1 1 0 0 1 1-1h3l1.5 1.75h5.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                </svg>
                Open
              </button>
              <button id="btn-save" class="btn btn-ghost btn-sm" type="button" title="Save (Ctrl/⌘+S)">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M3 2.5h8l2.5 2.5v8.5a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3A.5.5 0 0 1 3 2.5zM5 2.75v3.5h5v-3.5M5 13.5V9.5h6v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                </svg>
                Save
              </button>
              <button id="btn-saveas" class="btn btn-ghost btn-sm" type="button" title="Save as… (Ctrl/⌘+Shift+S)">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M8 2.5v7M5 6.75l3 3 3-3M3 11.5v1.25a.75.75 0 0 0 .75.75h8.5a.75.75 0 0 0 .75-.75V11.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Save As…
              </button>
            </div>
            <span id="file-name" class="file-name" title="Untitled.pine">
              <span id="file-name-text" class="file-name-text">Untitled.pine</span>
              <span id="file-dirty" class="file-dirty" title="Unsaved changes" hidden>●</span>
            </span>
          </div>
          <input id="file-input" type="file" accept=".pine,.txt,text/plain" hidden />

          <div class="toolbar">
            <div class="select-wrap">
              <select id="template-select" aria-label="Script examples"></select>
              <svg class="select-caret" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path d="m3.5 6 4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="toolbar-actions">
              <button id="btn-reset" class="btn btn-ghost" type="button" title="Restore the script as last loaded or saved">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M2.5 8a5.5 5.5 0 1 0 1.8-4.07M2.5 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="btn-label">Reset</span>
              </button>
              <button id="btn-share" class="btn btn-outline" type="button" title="Copy a link containing the script">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                  <path d="M6.5 9.5 9.5 6.5M7 4.5l.9-.9a3 3 0 0 1 4.25 4.25l-.9.9M9 11.5l-.9.9A3 3 0 0 1 3.85 8.15l.9-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="btn-label">Share</span>
              </button>
              <button id="btn-run" class="btn btn-run" type="button" title="⌘/Ctrl+Enter">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="M4.5 3v10l8-5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                </svg>
                Run
              </button>
            </div>
          </div>

          <div id="editor" class="editor"></div>
          <div id="status" class="status" role="status" aria-live="polite">
            <span class="status-dim">Loading the engine…</span>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
